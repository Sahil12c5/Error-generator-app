version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: nexus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexus_store
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: nexus_app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: nexus_user
      DB_PASSWORD: nexus_password
      DB_NAME: nexus_store
      PORT: 3000
    depends_on:
      - db
    # In a real environment, wait-for-it.sh is better, 
    # but for this demo, we'll let the Node app handle reconnection/retry
    restart: on-failure

volumes:
  mysql_data:
